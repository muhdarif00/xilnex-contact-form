<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>Xilnex — Contact Prototype</title>
<style>
  :root{
    /* Xilnex palette */
    --ink-900:#17131C;
    --ink-600:#514858;
    --ink-400:#94899A;

    --bg:#F8F5F9;
    --surface:#FFFFFF;

    --brand-700:#633A82;
    --brand-600:#7A4B9E;
    --brand-500:#A13B91;
    --brand-100:#F4EAF5;

    --accent-500:#D85CB7;
    --accent-100:#FBEAF7;

    --success-500:#7A4B9E;
    --border:#E5D8E8;

    --gradient-xilnex:linear-gradient(135deg,#633A82 0%,#7A4B9E 45%,#B13F9A 100%);
    --gradient-soft:linear-gradient(135deg,#FFFFFF 0%,#FCF8FC 55%,#F7EDF7 100%);
    --gradient-border:linear-gradient(135deg,#DCC7E2,#A13B91,#E9CBE5);

    --radius:16px;
    --shadow:0 2px 4px rgba(75,39,91,0.04), 0 14px 36px rgba(122,75,158,0.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 12% 10%, rgba(168,58,152,.08), transparent 36%),
      radial-gradient(circle at 88% 84%, rgba(211,183,214,.12), transparent 40%),
      linear-gradient(135deg,#FAF7FB 0%,#FDFCFD 52%,#F3EAF4 100%);
    color:var(--ink-900);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:32px 16px 64px;
  }
  @media (min-width:640px){ body{ align-items:center; } }

  .app{
    width:100%;
    max-width:920px;
  }

  /* Header / brand */
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:20px;
   padding-left:0;}
  .brand-mark{
    width:32px;height:32px;border-radius:9px;
    background:var(--gradient-xilnex);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:800;font-size:15px;letter-spacing:-0.02em;
    flex-shrink:0;
  }
  .brand-name{ font-weight:800; font-size:16px; letter-spacing:-0.01em; color:var(--brand-700); }
  .brand-sub{ font-size:12px; color:var(--ink-400); margin-left:auto; }

  /* Progress */
  .progress-wrap{ margin-bottom:24px; }
  .progress-track{
    height:6px; background:var(--border); border-radius:999px; overflow:hidden;
  }
  .progress-fill{
    height:100%; background:var(--gradient-xilnex);
    border-radius:999px;
    width:0%;
    transition:width .45s cubic-bezier(.4,0,.2,1);
  }
  .progress-label{
    display:flex; justify-content:space-between; margin-top:8px;
    font-size:12px; color:var(--ink-400); font-weight:600;
  }

  /* Card */
  .card{
    background:var(--gradient-soft);
    border:1px solid rgba(122,75,158,.14);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:28px 24px;
    background-image:
      radial-gradient(circle at 100% 100%, rgba(161,59,145,.07), transparent 32%),
      linear-gradient(135deg, rgba(255,255,255,.98), rgba(250,245,251,.98));
    position:relative;
    overflow:hidden;
  }
  .step{
    animation:stepIn .35s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes stepIn{
    from{ opacity:0; transform:translateY(6px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @media (prefers-reduced-motion: reduce){
    .step{ animation:none; }
    .progress-fill{ transition:none; }
  }

  .eyebrow{
    font-size:12px; font-weight:700; text-transform:none; letter-spacing:.06em;
    color:var(--brand-500); margin:0 0 6px;
  }
  h1.step-title{
    font-size:24px; font-weight:800; letter-spacing:0; line-height:1.25;
    margin:0 0 4px; color:var(--ink-900);
  }
  p.step-sub{
    font-size:14px; color:var(--ink-600); margin:0 0 22px; line-height:1.5;
  }

  .field{ margin-bottom:16px; }
  .field label{
    display:block; font-size:13px; font-weight:600; color:var(--ink-600); margin-bottom:6px;
  }
  .field input, .field textarea{
    width:100%; padding:12px 14px; border-radius:10px; border:1.5px solid var(--border);
    font-size:15px; font-family:inherit; color:var(--ink-900); background:#FBFCFE;
    transition:border-color .15s, box-shadow .15s;
  }
  .field input:focus, .field textarea:focus{
    outline:none; border-color:var(--brand-500);
    box-shadow:0 0 0 3px var(--brand-100);
    background:#fff;
  }
  .field textarea{ resize:vertical; min-height:88px; }
  .row-2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:420px){ .row-2{ grid-template-columns:1fr; } }
  .char-count{ font-size:11px; color:var(--ink-400); text-align:right; margin-top:4px; }

  /* Selectable cards (single-select) */
  .option-grid{ display:grid; gap:10px; margin-bottom:6px; }
  .option-grid.cols-3{ grid-template-columns:repeat(3,1fr); }
  .option-grid.cols-2{ grid-template-columns:repeat(2,1fr); }
  @media (max-width:420px){
    .option-grid.cols-3{ grid-template-columns:1fr; }
  }
  .opt-card{
    border:1.5px solid var(--border); border-radius:12px; padding:14px 12px;
    background:#FBFCFE; cursor:pointer; text-align:left;
    transition:border-color .15s, background .15s, transform .1s;
    display:flex; flex-direction:column; gap:2px;
    font-family:inherit;
  }
  .opt-card:hover{ border-color:var(--brand-500); }
  .opt-card:active{ transform:scale(.98); }

    height:24px;

  .opt-card .opt-icon{
    width:28px; height:28px; margin-bottom:5px;
    display:flex; align-items:center; justify-content:flex-start;
  }
  .opt-card .opt-icon svg{
    width:24px; height:24px; fill:none;
    stroke:url(#xilnexIconGradient); stroke-width:1.9;
    stroke-linecap:round; stroke-linejoin:round;
  }
  .opt-card .opt-icon svg circle{
    fill:none; stroke:url(#xilnexIconGradient);
  }

  .opt-card .retail-reference-icon{
    width:24px; height:24px; display:block; object-fit:contain;
    flex:0 0 24px;
    transform:scale(1.3);
    transform-origin:center;
  }

  .opt-card .opt-title{ font-weight:700; font-size:14.5px; color:var(--ink-900); }
  .opt-card .opt-desc{ font-size:12.5px; color:var(--ink-400); line-height:1.4; }
  .opt-card.selected{
    border-color:var(--brand-500);
    background:linear-gradient(135deg,#FCF7FC 0%,#F5EAF6 100%);
    box-shadow:0 8px 24px rgba(161,59,145,.10);
  }
  .opt-card.selected .opt-title{ color:var(--brand-700); }
  .opt-card .opt-check{
    display:none; align-self:flex-end; margin-top:-18px;
    width:18px;height:18px;border-radius:50%;
    background:var(--brand-500); color:#fff; font-size:12px;
    align-items:center; justify-content:center;
  }
  .opt-card.selected .opt-check{ display:flex; }

  /* Chips (multi-select) */
  .chip-grid{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:6px; }
  .chip{
    border:1.5px solid var(--border); border-radius:999px; padding:9px 14px;
    background:#FBFCFE; cursor:pointer; font-size:13.5px; font-weight:600;
    color:var(--ink-600); transition:all .15s; font-family:inherit;
  }
  .chip:hover{ border-color:var(--brand-500); }
  .chip.selected{
    background:var(--gradient-xilnex);
    border-color:transparent;
    color:#fff;
    box-shadow:0 5px 16px rgba(122,75,158,.18);
  }

  /* Buttons */
  .actions{ display:flex; gap:10px; margin-top:24px; }
  .btn{
    flex:1; padding:13px 18px; border-radius:11px; border:none;
    font-size:15px; font-weight:700; cursor:pointer; font-family:inherit;
    transition:transform .1s, opacity .15s, background .15s;
  }
  .btn:active{ transform:scale(.98); }
  .btn-primary{
    background:var(--gradient-xilnex); color:#fff;
    box-shadow:0 8px 20px rgba(122,75,158,.20);
  }
  .btn-primary:hover{
    background:linear-gradient(135deg,#563171 0%,#6E428F 45%,#963483 100%);
    box-shadow:0 10px 24px rgba(122,75,158,.26);
  }
  .btn-primary:disabled{ background:var(--ink-400); cursor:not-allowed; opacity:.6; }
  .btn-ghost{
    flex:0 0 auto; background:transparent; color:var(--ink-600); border:1.5px solid var(--border);
    padding:13px 16px;
  }
  .btn-ghost:hover{ border-color:var(--ink-400); }

  .hint-error{ font-size:12px; color:#DC2626; margin-top:6px; display:none; }
  .hint-error.show{ display:block; }

  /* Type cards on step 2 */
  .type-card{
    border:1.5px solid var(--border); border-radius:14px; padding:18px 16px;
    background:#FBFCFE; cursor:pointer; display:flex; gap:14px; align-items:flex-start;
    transition:border-color .15s, background .15s; margin-bottom:10px;
  }
  .type-card:hover{ border-color:var(--brand-500); }
  .type-card.selected{
    border-color:var(--brand-500);
    background:linear-gradient(135deg,#FCF7FC 0%,#F4E8F5 100%);
    box-shadow:0 8px 24px rgba(161,59,145,.10);
  }
  .type-emoji{
    width:40px;
    height:40px;
    border-radius:10px;
    background:#fff;
    border:1px solid #E5D9E5;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    box-shadow:0 3px 10px rgba(112,44,106,.05);
  }
  .type-emoji svg{
    width:22px;
    height:22px;
    fill:none;
    stroke:url(#xilnexIconGradient);
    stroke-width:1.9;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .type-emoji svg circle{
    fill:#fff;
    stroke:url(#xilnexIconGradient);
  }

  .type-title{ font-weight:700; font-size:15px; color:var(--ink-900); margin-bottom:2px;}
  .type-desc{ font-size:12.5px; color:var(--ink-400); line-height:1.4; }

  /* Confirmation */
  .confirm-icon{
    width:54px;height:54px;border-radius:50%;background:var(--gradient-xilnex);
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px;
    margin-bottom:16px;
  }
  .confirm-detail{
    background:#F7F9FF; border:1px solid var(--border); border-radius:12px; padding:14px 16px;
    font-size:13.5px; color:var(--ink-600); margin-top:16px; line-height:1.6;
  }
  .confirm-detail b{ color:var(--ink-900); }

  .footer-note{
    text-align:center; font-size:11.5px; color:var(--ink-400); margin-top:16px;
  }

  /* Xilnex brand refresh */
  :root{
    --ink-900:#111111;
    --ink-600:#4A4650;
    --ink-400:#8E8795;
    --bg:#F8F6F9;
    --surface:#FFFFFF;
    --brand-700:#6E246B;
    --brand-600:#8D2F86;
    --brand-500:#A83A98;
    --brand-100:#F7EAF6;
    --accent-500:#C77BC1;
    --accent-100:#F4E2F3;
    --border:#E5D9E5;
    --shadow:0 1px 2px rgba(50,20,50,.03), 0 14px 36px rgba(112,44,106,.08);
  }

  html,body{
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }

  .brand{
    margin-bottom:22px;
    min-height: 120px;
    display:flex;
    align-items:center;
  }

  .brand-logo{
    display:block;
    width: 936px;
    height:auto;
    max-height: 150px;
    object-fit:contain;
    object-position:left center;
   transform:translate(-18px,40px);}

  .progress-fill{
    background:linear-gradient(90deg,#7B2B75 0%,#A83A98 55%,#D47ACA 100%);
  }

  .card{
    background:
      radial-gradient(circle at 100% 100%, rgba(168,58,152,.09), transparent 38%),
      linear-gradient(135deg,#FFFFFF 0%,#FFFFFF 62%,#FCF6FC 100%);
    border-color:#E9DDE9;
  }

  .eyebrow{
    color:var(--brand-500);
  }

  .field input:focus,
  .field textarea:focus{
    border-color:var(--brand-500);
    box-shadow:0 0 0 3px rgba(168,58,152,.12);
  }

  .opt-card:hover,
  .type-card:hover,
  .chip:hover{
    border-color:var(--brand-500);
  }

  .opt-card.selected,
  .type-card.selected{
    border-color:var(--brand-500);
    background:linear-gradient(135deg,#FFF 0%,#FBF0FA 100%);
    box-shadow:0 8px 24px rgba(168,58,152,.08);
  }

  .opt-card.selected .opt-title,
  .type-card.selected .type-title{
    color:var(--brand-700);
  }

  .chip.selected{
    background:linear-gradient(90deg,#7B2B75,#A83A98);
    border-color:var(--brand-600);
  }

  .btn-primary{
    background:linear-gradient(90deg,#8D2F86 0%,#A83A98 60%,#B74AAA 100%);
    box-shadow:0 8px 20px rgba(141,47,134,.18);
  }

  .btn-primary:hover{
    background:linear-gradient(90deg,#6E246B 0%,#8D2F86 60%,#A83A98 100%);
  }

  .confirm-icon{
    background:linear-gradient(135deg,#7B2B75,#B74AAA);
  }
  .confirmation-step{
    text-align:center;
    padding:18px 8px 8px;
  }
  .confirmation-step .confirm-icon{
    width:72px;
    height:72px;
    margin:0 auto 20px;
    border-radius:22px;
    background:linear-gradient(135deg,#7B2B75 0%,#A83A98 55%,#D47ACA 100%);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:34px;
    font-weight:700;
    box-shadow:0 14px 30px rgba(141,47,134,.22);
  }
  .confirmation-step .confirm-icon svg{
    width:36px; height:36px; fill:none;
    stroke:#fff; stroke-width:2.8;
    stroke-linecap:round; stroke-linejoin:round;
  }
  .confirmation-step .step-title{
    font-size:28px;
    line-height:1.2;
    margin-bottom:8px;
  }
  .confirmation-step .step-sub{
    max-width:560px;
    margin:0 auto 24px;
  }
  .confirmation-summary{
    max-width:620px;
    margin:0 auto;
    text-align:left;
    background:linear-gradient(135deg,#FFFFFF 0%,#FBF7FC 100%);
    border:1px solid #E7DCE8;
    border-radius:16px;
    padding:18px 20px;
    box-shadow:0 8px 24px rgba(112,44,106,.06);
  }
  .confirmation-summary-title{
    font-size:12px;
    font-weight:700;
    color:var(--brand-500);
    letter-spacing:.04em;
    margin-bottom:12px;
  }
  .confirmation-row{
    display:flex;
    justify-content:space-between;
    gap:20px;
    padding:9px 0;
    border-bottom:1px solid #EEE7EF;
    font-size:13px;
  }
  .confirmation-row:last-child{border-bottom:0;}
  .confirmation-label{color:var(--ink-400);}
  .confirmation-value{
    color:var(--ink-900);
    font-weight:600;
    text-align:right;
    max-width:65%;
    word-break:break-word;
  }
  .confirmation-note{
    margin-top:18px;
    font-size:12px;
    color:var(--ink-400);
  }
  .confirmation-actions{
    display:flex;
    justify-content:center;
    margin-top:22px;
  }
  .confirmation-actions .btn{
    flex:0 0 auto;
    min-width:140px;
  }



  /* Split welcome page */
  .welcome-layout{
    min-height:520px;
    display:grid;
    grid-template-columns:1.05fr .95fr;
    border-radius:18px;
    overflow:hidden;
    background:#fff;
    border:1px solid rgba(122,75,158,.14);
    box-shadow:0 18px 50px rgba(112,44,106,.12);
  }
  .welcome-visual{
    position:relative;
    overflow:hidden;
    padding:52px 46px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    background:
      radial-gradient(circle at 78% 22%,rgba(255,255,255,.25),transparent 24%),
      radial-gradient(circle at 18% 88%,rgba(255,255,255,.10),transparent 30%),
      linear-gradient(135deg,#6E246B 0%,#8D2F86 40%,#A83A98 72%,#C77BC1 100%);
    color:#fff;
  }
  .welcome-visual::after{
    content:"";
    position:absolute;
    width:430px;
    height:430px;
    right:-190px;
    bottom:-210px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.18);
    box-shadow:0 0 0 45px rgba(255,255,255,.035),0 0 0 90px rgba(255,255,255,.025);
  }
  .welcome-visual-logo{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:48px;
    position:relative;
    z-index:1;
  }
  .welcome-visual-logo-mark{

<div>
            <h1>Let’s make your enquiry easier.</h1>
            <p>
              Tell us a little about yourself and what you’re looking for.
              We’ll use your answers to connect you with the right Xilnex team.
            </p>

            <div class="welcome-visual-caption">
              <span class="welcome-pill">Simple</span>
              <span class="welcome-pill">Relevant</span>
              <span class="welcome-pill">Built for your needs</span>
            </div>
          </div>
        </section>

        <section class="welcome-form">
          <p class="eyebrow">Get started</p>
          <h2>Tell us about yourself</h2>
          <p class="welcome-form-sub">A few details first, then we’ll guide you through the rest.</p>

          <div class="row-2">
            <div class="field">
              <label>Given name</label>
              <input id="firstName" type="text" placeholder="Your first name" value="${esc(state.firstName)}">
              <div class="hint-error" id="firstNameErr">Please enter your name.</div>
            </div>
            <div class="field">
              <label>Family name</label>
              <input id="lastName" type="text" placeholder="Your last name" value="${esc(state.lastName)}">
              <div class="hint-error" id="lastNameErr">Please enter your name.</div>
            </div>
          </div>

          <div class="field">
            <label>Mobile number</label>
            <input id="mobile" type="tel" placeholder="Enter your mobile number" value="${esc(state.mobile)}">
            <div class="hint-error" id="mobileErr">Please enter your mobile number.</div>
          </div>

          <div class="field">
            <label>Work email</label>
            <input id="email" type="email" placeholder="you@company.com" value="${esc(state.email)}">
            <div class="hint-error" id="emailErr">Please enter a valid email address.</div>
          </div>

          <div class="field">
            <label>Business name</label>
            <input id="company" type="text" placeholder="Enter your company name" value="${esc(state.company)}">
            <div class="hint-error" id="companyErr">Please enter your company name.</div>
          </div>

          <div class="actions">
            <button type="button" class="btn btn-primary" id="continueBtn">Next step</button>
          </div>

          <div class="welcome-mini">It only takes a few moments.</div>
        </section>
      </div>
    `;

    const sync = () => {
      state.firstName = document.getElementById('firstName').value.trim();
      state.lastName = document.getElementById('lastName').value.trim();
      state.mobile = document.getElementById('mobile').value.trim();
      state.email = document.getElementById('email').value.trim();
      state.company = document.getElementById('company').value.trim();
    };

    ['firstName','lastName','mobile','email','company'].forEach(id => {
      document.getElementById(id).addEventListener('input', sync);
    });

    document.getElementById('continueBtn').addEventListener('click', () => {
      sync();
      let valid = true;

      ['firstName','lastName','mobile','email','company'].forEach(id => {
        const value = document.getElementById(id).value.trim();
        const err = document.getElementById(id + 'Err');
        if(!value){
          err.classList.add('show');
          valid = false;
        }else{
          err.classList.remove('show');
        }
      });

      const email = document.getElementById('email').value.trim();
      if(email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
        document.getElementById('emailErr').textContent = 'Please enter a valid email address.';
        document.getElementById('emailErr').classList.add('show');
        valid = false;
      }

      if(valid){
        step = 1;
        render();
      }
    });
  }

  function renderInquiryType(){
    document.querySelector('.app').classList.remove('welcome-mode');
    card.classList.remove('welcome-card');
    card.classList.add('compact-step');
    const types = [

        <path d="M4 5h4M4 8h3M4 11h2"/>
      </svg>`, title:'Support', desc:'Already using Xilnex? Our team is here to help.'}
    ];
    card.innerHTML = `
      <div class="step">
        <p class="eyebrow">Choose your enquiry</p>
        <h1 class="step-title">What would you like to discuss?</h1>
        <p class="step-sub">Choose an option and we'll tailor the next step to you.</p>
        <div id="typeList">
          ${types.map(t => `
            <div class="type-card ${state.inquiryType===t.id?'selected':''}" data-id="${t.id}">
              <div class="type-emoji">${t.icon}</div>

                <div class="type-title">${t.title}</div>

          <button class="btn btn-ghost" id="backBtn">Previous</button>
          <button class="btn btn-primary" id="nextBtn">Next step</button>
        </div>
      </div>
    `;
    document.querySelectorAll('.type-card').forEach(el => {
      el.addEventListener('click', () => {
        state.inquiryType = el.dataset.id;
        document.querySelectorAll('.type-card').forEach(c=>c.classList.remove('selected'));
        el.classList.add('selected');
      });
    });
    document.getElementById('backBtn').addEventListener('click', () => { step = 0; render(); });
    document.getElementById('nextBtn').addEventListener('click', () => {
      if(!state.inquiryType){ document.getElementById('errType').classList.add('show'); return; }
      step = 2; render();
    });
  }

  function renderBranch(){
    document.querySelector('.app').classList.remove('welcome-mode');
    card.classList.remove('welcome-card');
    card.classList.add('compact-step');
    if(state.inquiryType === 'sales') return renderBranchSales();
    if(state.inquiryType === 'partnership') return renderBranchPartnership();
    if(state.inquiryType === 'support') return renderBranchSupport();
  }

          <button class="btn btn-ghost" id="backBtn">Previous</button>
          <button class="btn btn-primary" id="nextBtn">Submit enquiry</button>
        </div>
      </div>
    `;
    document.querySelectorAll('#storeSizeGrid .opt-card').forEach(el=>{
      el.addEventListener('click', ()=>{
        state.storeSize = el.dataset.val;
        document.querySelectorAll('#storeSizeGrid .opt-card').forEach(c=>c.classList.remove('selected'));
        el.classList.add('selected');
      });
    });
    document.querySelectorAll('#industryGrid .opt-card').forEach(el=>{
      el.addEventListener('click', ()=>{
        state.industry = el.dataset.val;
        document.querySelectorAll('#industryGrid .opt-card').forEach(c=>c.classList.remove('selected'));
        el.classList.add('selected');
      });
    });
    document.querySelectorAll('#painGrid .chip').forEach(el=>{
      el.addEventListener('click', ()=>{
        const v = el.dataset.val;
        if(state.painPoints.includes(v)){
          state.painPoints = state.painPoints.filter(x=>x!==v);
          el.classList.remove('selected');
        } else {
          state.painPoints.push(v);
          el.classList.add('selected');
        }
      });
    });
    document.getElementById('backBtn').addEventListener('click', () => { step = 1; render(); });
    document.getElementById('nextBtn').addEventListener('click', () => {
      if(!state.storeSize || !state.industry){ document.getElementById('errSales').classList.add('show'); return; }
      step = 3; render();
    });
    const msgEl = document.querySelector('.branch-message');
    const countEl = document.querySelector('.branch-char-count');
    msgEl.addEventListener('input', e => {
      state.message = e.target.value;
      countEl.textContent = e.target.value.length;
    });

  }

  function renderBranchPartnership(){
    const cats = [
      {id:'Media', icon:`<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m7 9 4 3-4 3z"/><path d="M14 9h4M14 12h4M14 15h3"/></svg>`},
      {id:'Distributor', icon:`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 7 8-4 8 4-8 4z"/><path d="M4 7v10l8 4 8-4V7"/><path d="M12 11v10"/><path d="m8 5 8 4"/></svg>`},
      {id:'Hardware', icon:`<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/></svg>`},
      {id:'Software', icon:`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.2 4.6L19 9.8l-4.8 2.2L12 17l-2.2-5-4.8-2.2 4.8-2.2z"/><path d="m19 15 .9 1.9L22 18l-2.1 1.1L19 21l-1-1.9L16 18l2-1.1z"/></svg>`},
      {id:'Events', icon:`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v5M17 3v5"/><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 10h16"/><path d="M8 14h3M8 17h5"/></svg>`}
    ];
    card.innerHTML = `
      <div class="step">
        <p class="eyebrow">Since you're after Media & Partnerships</p>
        <h1 class="step-title">What are you looking to collaborate on?</h1>
        <p class="step-sub">Choose the closest match and we'll direct it to the right team.</p>

        <div class="option-grid cols-3" id="catGrid">
          ${cats.map(c => `
            <button type="button" class="opt-card ${state.partnerCategory===c.id?'selected':''}" data-val="${c.id}">
              <span class="opt-icon">${c.icon}</span><span class="opt-title">${c.id}</span>
            </button>`).join('')}
        </div>
        <div class="hint-error" id="errCat">Please select a category to continue.</div>

        <div class="field message-field">
          <label>Anything else you'd like to share? <span style="font-weight:400;color:var(--ink-400)">(optional)</span></label>
          <textarea class="branch-message" maxlength="180" placeholder="Add a few details about what you need...">${esc(state.message)}</textarea>
          <div class="char-count"><span class="branch-char-count">${state.message.length}</span> / 180</div>
        </div>

        <div class="actions">
          <button class="btn btn-ghost" id="backBtn">Previous</button>
          <button class="btn btn-primary" id="nextBtn">Submit enquiry</button>
        </div>
      </div>
    `;
    document.querySelectorAll('#catGrid .opt-card').forEach(el=>{
      el.addEventListener('click', ()=>{
        state.partnerCategory = el.dataset.val;
        document.querySelectorAll('#catGrid .opt-card').forEach(c=>c.classList.remove('selected'));
        el.classList.add('selected');
      });
    });
    document.getElementById('backBtn').addEventListener('click', () => { step = 1; render(); });
    document.getElementById('nextBtn').addEventListener('click', () => {
      if(!state.partnerCategory){ document.getElementById('errCat').classList.add('show'); return; }
      step = 3; render();
    });
    const msgEl = document.querySelector('.branch-message');
    const countEl = document.querySelector('.branch-char-count');
    msgEl.addEventListener('input', e => {
      state.message = e.target.value;
      countEl.textContent = e.target.value.length;
    });

  }

  function renderBranchSupport(){
    card.innerHTML = `
      <div class="step">
        <p class="eyebrow">For existing customers</p>
        <h1 class="step-title">Let's locate your account</h1>
        <p class="step-sub">These details help us get your request to the right support team.</p>

        <div class="field">
          <label>Which Xilnex product can we help with? <span style="font-weight:400;color:var(--ink-400)">(select all that apply)</span></label>
          <div class="chip-grid" id="productGrid">
            ${supportProductOptions.map(p => `<button type="button" class="chip ${state.supportProducts.includes(p)?'selected':''}" data-val="${esc(p)}">${p}</button>`).join('')}
          </div>
        </div>

        <div class="field">
          <label>COM ID</label>
          <input type="text" id="comId" value="${esc(state.comId)}" placeholder="Enter your Xilnex COM ID">
        </div>
        <div class="field">
          <label>Zoho ticket number <span style="font-weight:400;color:var(--ink-400)">(if you already have one)</span></label>
          <input type="text" id="zohoTicket" value="${esc(state.zohoTicket)}" placeholder="Optional">
        </div>

        <div class="hint-error" id="errSupport">Enter your COM ID before continuing.</div>

        <div class="field message-field">
          <label>Anything else you'd like to share? <span style="font-weight:400;color:var(--ink-400)">(optional)</span></label>
          <textarea class="branch-message" maxlength="180" placeholder="Add a few details about what you need...">${esc(state.message)}</textarea>
          <div class="char-count"><span class="branch-char-count">${state.message.length}</span> / 180</div>
        </div>

        <div class="actions">
          <button class="btn btn-ghost" id="backBtn">Previous</button>
          <button class="btn btn-primary" id="nextBtn">Submit enquiry</button>
        </div>
      </div>
    `;
    document.querySelectorAll('#productGrid .chip').forEach(el=>{
      el.addEventListener('click', ()=>{
        const v = el.dataset.val;
        if(state.supportProducts.includes(v)){
          state.supportProducts = state.supportProducts.filter(x=>x!==v);
          el.classList.remove('selected');
        } else {
          state.supportProducts.push(v);
          el.classList.add('selected');
        }
      });
    });
    document.getElementById('comId').addEventListener('input', e => state.comId = e.target.value);
    document.getElementById('zohoTicket').addEventListener('input', e => state.zohoTicket = e.target.value);
    document.getElementById('backBtn').addEventListener('click', () => { step = 1; render(); });
    document.getElementById('nextBtn').addEventListener('click', () => {
      if(!state.comId){ document.getElementById('errSupport').classList.add('show'); return; }
      step = 3; render();
    });
    const msgEl = document.querySelector('.branch-message');
    const countEl = document.querySelector('.branch-char-count');
    msgEl.addEventListener('input', e => {
      state.message = e.target.value;
      countEl.textContent = e.target.value.length;
    });

  }

  function renderConfirmation(){
    document.querySelector('.app').classList.remove('welcome-mode');
    card.classList.remove('welcome-card');
    card.classList.add('compact-step');
    const routeMap = {
      sales: {team:'Sales', eta:'1 business day'},
      partnership: {team:'BD & Partnerships', eta:'2 business days'},
      support: {team:'Customer Support', eta:'a few hours'}
    };
    const route = routeMap[state.inquiryType] || {team:'the right team', eta:'shortly'};

    const fullName = [state.firstName, state.lastName].filter(Boolean).join(' ');
    const requestType =
      state.inquiryType === 'sales' ? 'Explore Xilnex' :
      state.inquiryType === 'partnership' ? 'Partnership & Media' :
      'Customer Support';

    let detailRows = '';

    if(state.inquiryType === 'sales'){
      const labels = painPointOptions
        .filter(p => state.painPoints.includes(p.id))
        .map(p => p.label)
        .join(', ');

      detailRows = `
        <div class="confirmation-row">
          <span class="confirmation-label">Number of outlets</span>
          <span class="confirmation-value">${esc(state.storeSize || '—')}</span>
        </div>
        <div class="confirmation-row">
          <span class="confirmation-label">Industry</span>
          <span class="confirmation-value">${esc(state.industry || '—')}</span>
        </div>
        ${labels ? `
        <div class="confirmation-row">
          <span class="confirmation-label">Focus areas</span>
          <span class="confirmation-value">${esc(labels)}</span>
        </div>` : ''}`;
    } else if(state.inquiryType === 'partnership'){
      detailRows = `
        <div class="confirmation-row">
          <span class="confirmation-label">Category</span>
          <span class="confirmation-value">${esc(state.partnerCategory || '—')}</span>
        </div>`;
    } else {
      detailRows = `
        <div class="confirmation-row">
          <span class="confirmation-label">Products</span>
          <span class="confirmation-value">${esc(state.supportProducts.join(', ') || '—')}</span>
        </div>
        <div class="confirmation-row">
          <span class="confirmation-label">Com ID</span>
          <span class="confirmation-value">${esc(state.comId || '—')}</span>
        </div>
        ${state.zohoTicket ? `
        <div class="confirmation-row">
          <span class="confirmation-label">Zoho ticket</span>
          <span class="confirmation-value">${esc(state.zohoTicket)}</span>
        </div>` : ''}`;
    }

    card.innerHTML = `
      <div class="step confirmation-step">
        <div class="confirm-icon" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="m7 16.5 6 6 12-13"/></svg></div>
        <h1 class="step-title">You're all set${state.firstName ? ', ' + esc(state.firstName) : ''}!</h1>
        <p class="step-sub">We've received your request. The ${route.team} team will contact you within ${route.eta}.</p>

        <div class="confirmation-summary">
          <div class="confirmation-summary-title">Request overview</div>

          <div class="confirmation-row">
            <span class="confirmation-label">Name</span>
            <span class="confirmation-value">${esc(fullName || '—')}</span>
          </div>

          <div class="confirmation-row">
            <span class="confirmation-label">Business name</span>
            <span class="confirmation-value">${esc(state.company || '—')}</span>
          </div>

          <div class="confirmation-row">
            <span class="confirmation-label">Mobile number</span>
            <span class="confirmation-value">${esc(state.mobile || '—')}</span>
          </div>

          <div class="confirmation-row">
            <span class="confirmation-label">Work email</span>
            <span class="confirmation-value">${esc(state.email || '—')}</span>
          </div>

          <div class="confirmation-row">
            <span class="confirmation-label">Request</span>
            <span class="confirmation-value">${requestType}</span>
          </div>

          ${detailRows}

          ${state.message ? `
          <div class="confirmation-row">
            <span class="confirmation-label">Additional notes</span>
            <span class="confirmation-value">${esc(state.message)}</span>
          </div>` : ''}
        </div>

        <p class="confirmation-note">Thanks for reaching out. We look forward to speaking with you.</p>

        <div class="confirmation-actions">
          <button class="btn btn-ghost" id="restartBtn">Submit another request</button>
        </div>
      </div>
    `;

    document.getElementById('restartBtn').addEventListener('click', () => {
      Object.assign(state, {
        firstName:'', lastName:'', mobile:'', email:'', company:'',
        inquiryType:null, storeSize:null, industry:null, painPoints:[],
        partnerCategory:null, supportProducts:[], comId:'', zohoTicket:'', message:''
      });
      step = 0;
      render();
    });
  }

  render();
})();
</script>
</body>
</html>
